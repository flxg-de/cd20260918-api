openapi: 3.0.3
info:
  title: Community Day Slot Manager API
  description: |
    API zur Verwaltung von Community Days, Vortrags-Einreichungen (Talks) und
    deren Zuordnung zu Slots.

    ## Tagesraster: Slots × Zeit

    Der Tagesablauf wird als Tabelle gedacht (siehe interne Confluence-Seite):
    Spalten sind **Slots** — benannte, über den ganzen Tag laufende Tracks/
    Swimlanes (z. B. "Amt für gute Ideen", "Neuland"), inkl. Raum, Standort
    und Format. Die Zeit ist **swimlane-übergreifend durchgängig** und nicht
    in vorab angelegte, gemeinsame Zeitfenster unterteilt: Jeder Talk trägt
    seine eigene `startTime` und `durationMinutes` und kann unabhängig von
    den Talks in anderen Slots platziert werden. So passen z. B. in Slot 1
    zwischen 9 und 12 Uhr drei 45-minütige Vorträge (mit vom Organisator
    eingeplanten Pausen), während im selben Zeitraum in Slot 2 fünf kürzere
    Vorträge stattfinden. Pausen/Puffer zwischen Talks sind nicht Teil des
    Datenmodells, sondern liegen in der Verantwortung der Organisatoren beim
    Platzieren (zwei Talks dürfen direkt ohne Lücke aneinandergereiht
    werden). Für die Übersichtsdarstellung (`/schedule`) wird serverseitig
    ein einheitliches 15-Minuten-Zeilenraster erzeugt; dieses Raster ist rein
    eine Darstellungshilfe und keine eigene Entität.

    Manche Programmpunkte gehören zum festen Tagesablauf (Frühstück,
    regionale Slots, Vorstellung, Mittagspause, Geschäftsführungs-Slot) und
    gelten slot-/track-übergreifend für den ganzen Tag. Sie werden als Talks
    mit `isFixedProgram: true` und `slotId: null` abgebildet und sind für
    die reguläre Slot-Zuordnung nicht verfügbar.

    Ein Community Day durchläuft zwei Phasen:
      1. **Einreichungsphase** (`SUBMISSION`): Talks werden eingereicht,
         Slots existieren noch nicht oder nicht vollständig.
      2. **Planungsphase** (`PLANNING`): Organisatoren legen Slots an und
         ordnen Talks per Slot + Startzeit ein.

    Alle Talk- und Slot-Operationen beziehen sich implizit auf den jeweils
    aktuellen Community Day, sofern nicht explizit ein anderer (historischer)
    Community Day referenziert wird.
  version: 3.0.0
servers:
  - url: /api/v1

tags:
  - name: community-days
    description: Durchführungen des Community Day (Einreichung, Planung, Historie)
  - name: talks
    description: Vortrags-Einreichungen
  - name: slots
    description: Benannte Tracks/Swimlanes (Spalten des Tagesrasters)
  - name: schedule
    description: Kombinierte Tagesübersicht (Slots × 15-Minuten-Zeilenraster × zugeordnete Talks)

security:
  - bearerAuth: []

paths:
  /community-days:
    get:
      tags: [community-days]
      operationId: listCommunityDays
      summary: Alle Community Days auflisten (inkl. Historie)
      security: []
      responses:
        '200':
          description: Liste der Community Days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityDay'
    post:
      tags: [community-days]
      operationId: createCommunityDay
      summary: Neuen Community Day anlegen
      description: |
        Nur für Organisatoren. Legt automatisch einen Vorschlag für den
        festen Tagesablauf (Frühstück, regionale Slots, Vorstellung,
        Mittagspause, Geschäftsführungs-Slot) als Talks mit
        `isFixedProgram: true` und `slotId: null` an.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDayCreateRequest'
      responses:
        '201':
          description: Community Day wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /community-days/current:
    get:
      tags: [community-days]
      operationId: getCurrentCommunityDay
      summary: Den aktuellen Community Day abrufen
      description: >
        Liefert den Community Day, für den Einreichung bzw. Planung aktuell
        offen ist.
      security: []
      responses:
        '200':
          description: Der aktuelle Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    get:
      tags: [community-days]
      operationId: getCommunityDay
      summary: Einen Community Day per ID abrufen
      security: []
      responses:
        '200':
          description: Der Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [community-days]
      operationId: updateCommunityDay
      summary: Stammdaten des Community Day bearbeiten (Titel, Datum, Fristen)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDayUpdateRequest'
      responses:
        '200':
          description: Aktualisierter Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}/transition-to-planning:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    post:
      tags: [community-days]
      operationId: transitionToPlanning
      summary: Von Einreichungs- in Planungsphase wechseln
      description: |
        Nur für Organisatoren. Bewusster, nachvollziehbarer Schritt, der die
        Einreichung neuer Talks für diesen Community Day beendet und die
        Zuordnung von Talks zu Slot/Zeitfenster-Zellen freischaltet. Nicht
        umkehrbar.
      responses:
        '200':
          description: Community Day befindet sich jetzt in der Planungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Community Day ist bereits in der Planungsphase oder abgeschlossen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /community-days/{communityDayId}/transition-to-published:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    post:
      tags: [community-days]
      operationId: transitionToPublished
      summary: Programm veröffentlichen (Planungs- in Veröffentlichungsphase wechseln)
      description: |
        Nur für Organisatoren. Beendet die Planung und macht das Programm für
        alle sichtbar (Programm-Ansicht, Favoriten/"Mein Tag"). Nicht umkehrbar.
      responses:
        '200':
          description: Community Day befindet sich jetzt in der Veröffentlichungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Community Day ist nicht in der Planungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /community-days/{communityDayId}/schedule:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    get:
      tags: [schedule]
      operationId: getSchedule
      summary: Kombinierte Tagesübersicht (Slots × 15-Minuten-Raster × Talks)
      description: >
        Entspricht der tabellarischen Tagesübersicht: alle Slots (Spalten)
        und ein serverseitig aus den platzierten Talks abgeleitetes
        Zeilenraster in 15-Minuten-Schritten. Eine `ScheduleCell` wird nur in
        der Zeile geführt, in der der jeweilige Talk beginnt, inkl.
        `rowSpan` (Anzahl 15-Minuten-Zeilen, die er einnimmt); die
        Folgezeilen enthalten für diesen Slot keine eigene Zelle (analog zu
        einem HTML-`rowspan`). Fixe, slotübergreifende Programmpunkte
        (`isFixedProgram: true`) erscheinen je Zeile als `programItem` statt
        als `cells`-Eintrag. Grundlage für Planungsansicht und Kalender-UI.
      security: []
      responses:
        '200':
          description: Tagesübersicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks:
    get:
      tags: [talks]
      operationId: listTalks
      summary: Talks des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TalkStatus'
        - name: mine
          in: query
          required: false
          description: Nur eigene Talks des angemeldeten Referenten
          schema:
            type: boolean
        - name: favorite
          in: query
          required: false
          description: Nur vom angemeldeten Nutzer favorisierte Talks ("Mein Tag")
          schema:
            type: boolean
      security: []
      responses:
        '200':
          description: Liste der Talks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Talk'
    post:
      tags: [talks]
      operationId: createTalk
      summary: Neuen Talk für den aktuellen Community Day einreichen
      description: Nur möglich, solange sich der aktuelle Community Day in der Einreichungsphase befindet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '201':
          description: Talk wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Aktueller Community Day befindet sich nicht in der Einreichungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    get:
      tags: [talks]
      operationId: getTalk
      summary: Einen Talk per ID abrufen
      security: []
      responses:
        '200':
          description: Der Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [talks]
      operationId: updateTalk
      summary: Talk aktualisieren
      description: >
        Nur durch den/die einreichende/n Referent/in (Besitzer/in), solange
        fachlich erlaubt (z. B. noch nicht zugeordnet oder abgelehnt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk darf in seinem aktuellen Status nicht mehr geändert werden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [talks]
      operationId: withdrawTalk
      summary: Talk zurückziehen/löschen
      description: Durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/tags:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: updateTalkTags
      summary: Tags eines Talks setzen
      description: Nur durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/assignment:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: assignTalkToSlot
      summary: Talk einem Slot zu einer Startzeit zuordnen (oder Zuordnung aufheben)
      description: |
        Nur für Organisatoren, nur während der Planungsphase. `slotId` und
        `startTime` müssen gemeinsam gesetzt werden (die Dauer ergibt sich
        aus `durationMinutes` des Talks); beide `null` hebt eine bestehende
        Zuordnung auf. Es wird geprüft, ob der Ziel-Slot für Talk-Zuordnung
        verfügbar ist (kein `isFixedProgram`-Talk) und ob sich der
        Talk-Zeitraum mit einem bereits im selben Slot zugeordneten Talk
        zeitlich überschneidet. Ein direktes, pausenloses Aneinanderreihen
        zweier Talks (Ende des einen = Start des nächsten) gilt nicht als
        Überschneidung. Puffer-/Pausenzeiten zwischen Talks werden nicht
        automatisch erzwungen, sondern liegen in der Verantwortung der
        Organisatoren. Bei einem Konflikt wird die bestehende Zuordnung
        nicht stillschweigend überschrieben, sondern die Anfrage mit `409`
        abgelehnt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Konflikt (Slot ist ein fester Programmpunkt oder Zeitraum überschneidet sich mit einem anderen Talk im selben Slot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}/vote:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    post:
      tags: [talks]
      operationId: voteForTalk
      summary: Interessestimme für einen Talk abgeben
      description: Ein Nutzer kann pro Talk höchstens einmal abstimmen.
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nutzer hat bereits für diesen Talk abgestimmt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [talks]
      operationId: removeVoteForTalk
      summary: Eigene Interessestimme für einen Talk zurückziehen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/favorite:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    post:
      tags: [talks]
      operationId: favoriteTalk
      summary: Talk zu "Mein Tag" hinzufügen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [talks]
      operationId: unfavoriteTalk
      summary: Talk aus "Mein Tag" entfernen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/rejection:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: rejectTalk
      summary: Talk ablehnen
      description: Nur für Organisatoren. Setzt den Talk-Status auf `REJECTED`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Abgelehnter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk ist bereits einer Zelle zugeordnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /slots:
    get:
      tags: [slots]
      operationId: listSlots
      summary: Alle Slots (Tracks/Spalten) des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Location'
      security: []
      responses:
        '200':
          description: Liste der Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
    post:
      tags: [slots]
      operationId: createSlot
      summary: Neuen Slot (Track/Spalte) anlegen
      description: >
        Nur für Organisatoren, typischerweise zu Beginn der Planungsphase.
        Die Anzahl der Slots ergibt sich aus dem Bedarf der eingereichten
        Talks (erfahrungsgemäß bis zu 5 parallele Slots).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '201':
          description: Slot wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/{slotId}:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    get:
      tags: [slots]
      operationId: getSlot
      summary: Einen Slot per ID abrufen
      security: []
      responses:
        '200':
          description: Der Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [slots]
      operationId: updateSlot
      summary: Slot aktualisieren (z. B. Name, Raum, Standort, Format)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '200':
          description: Aktualisierter Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [slots]
      operationId: deleteSlot
      summary: Slot löschen
      description: >
        Nur für Organisatoren. Ein Slot mit noch zugeordneten Talks kann
        nicht gelöscht werden.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slot hat noch zugeordnete Talks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SSO/OIDC-Zugriffstoken; enthält die Rolle (`REFERENT` oder `ORGANISATOR`) des Nutzers.

  parameters:
    CommunityDayId:
      name: communityDayId
      in: path
      required: true
      schema:
        type: string
    TalkId:
      name: talkId
      in: path
      required: true
      schema:
        type: string
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Aktion für die aktuelle Rolle nicht erlaubt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CommunityDayPhase:
      type: string
      enum: [SUBMISSION, PLANNING, PUBLISHED, COMPLETED]
      description: >
        SUBMISSION: Einreichungsphase. PLANNING: Planungsphase (Slots und
        Zeitfenster werden angelegt, Talks zugeordnet). PUBLISHED: Programm
        ist veröffentlicht (Programm-Ansicht und Favoriten/"Mein Tag" sind
        sichtbar). COMPLETED: Durchführung ist abgeschlossen und nur noch
        als Historie einsehbar.

    CommunityDayCreateRequest:
      type: object
      required: [name, description, date]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date
        submissionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Einsendeschluss für reguläre Einreichungen.
        lateSubmissionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Letzter Termin für Nachreichungen während der Planungsphase.

    CommunityDayUpdateRequest:
      type: object
      description: Teilaktualisierung der Stammdaten; nicht gesetzte Felder bleiben unverändert.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date
        submissionDeadline:
          type: string
          format: date-time
          nullable: true
        lateSubmissionDeadline:
          type: string
          format: date-time
          nullable: true

    CommunityDay:
      allOf:
        - $ref: '#/components/schemas/CommunityDayCreateRequest'
        - type: object
          required: [id, phase]
          properties:
            id:
              type: string
            phase:
              $ref: '#/components/schemas/CommunityDayPhase'

    TalkStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, REJECTED]

    Location:
      type: string
      description: Standort, relevant bei Slots vor Ort/hybrid.
      enum:
        - NOCHEN
        - ESSEN
        - BERLIN
        - HAMBURG
        - MUENCHEN
        - BAD_HOMBURG
        - NUERNBERG
        - STUTTGART
        - KRAKOW

    SlotFormat:
      type: string
      description: Format des Slots; ein zugeordneter Talk übernimmt es implizit.
      enum: [ON_SITE, HYBRID, VIRTUAL]

    TalkCreateRequest:
      type: object
      required: [title, speakers, durationMinutes]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        speakers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 80
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 120
        tags:
          type: array
          items:
            type: string
        isFixedProgram:
          type: boolean
          default: false
          description: >
            true für feste, slotübergreifende Tagesablauf-Punkte (Frühstück,
            regionale Slots, Vorstellung, Mittagspause,
            Geschäftsführungs-Slot). Solche Talks haben immer `slotId: null`
            und sind für die reguläre Slot-Zuordnung nicht verfügbar.

    Talk:
      allOf:
        - $ref: '#/components/schemas/TalkCreateRequest'
        - type: object
          required: [id, communityDayId, status]
          properties:
            id:
              type: string
            communityDayId:
              type: string
            status:
              $ref: '#/components/schemas/TalkStatus'
            ownerId:
              type: string
              description: ID des/der einreichenden Referent/in
            slotId:
              type: string
              nullable: true
              description: >
                Track/Spalte, der der Talk zugeordnet ist. Immer `null` bei
                `isFixedProgram: true` (spannt swimlane-übergreifend über den
                ganzen Tag).
            startTime:
              type: string
              format: date-time
              nullable: true
              description: >
                Startzeitpunkt des Talks. Die Endzeit ergibt sich aus
                `startTime + durationMinutes`. Frei wählbar innerhalb des
                Community-Day-Zeitfensters und unabhängig von den Startzeiten
                in anderen Slots; Pausen/Puffer zu benachbarten Talks im
                selben Slot müssen von den Organisatoren selbst eingeplant
                werden.
            rejectionReason:
              type: string
              nullable: true
            votes:
              type: integer
              default: 0
              description: Anzahl der Interessestimmen.
            votedByMe:
              type: boolean
              default: false
              description: Ob der angemeldete Nutzer bereits für diesen Talk abgestimmt hat.
            favoritedByMe:
              type: boolean
              default: false
              description: Ob der angemeldete Nutzer diesen Talk zu "Mein Tag" hinzugefügt hat.
            teamsLink:
              type: string
              nullable: true
              description: >
                Wird nicht bei der Zuordnung selbst gesetzt, sondern erst zu
                einem späteren Zeitpunkt generiert und ergänzt.

    AssignmentRequest:
      type: object
      description: >
        Zum Zuordnen müssen `slotId` und `startTime` gemeinsam gesetzt
        werden; beide `null` hebt eine bestehende Zuordnung auf. Die Dauer
        ergibt sich aus `durationMinutes` des Talks.
      properties:
        slotId:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true

    SlotCreateRequest:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
          description: >
            Name des Tracks/der Swimlane (Spaltenüberschrift), z. B. "Amt für
            gute Ideen" oder "Neuland". Bündelt über den Tag hinweg
            thematisch ähnliche Talks.
        room:
          type: string
        format:
          $ref: '#/components/schemas/SlotFormat'
        location:
          $ref: '#/components/schemas/Location'

    Slot:
      allOf:
        - $ref: '#/components/schemas/SlotCreateRequest'
        - type: object
          required: [id, communityDayId]
          properties:
            id:
              type: string
            communityDayId:
              type: string

    ScheduleCell:
      type: object
      required: [slotId, talk, rowSpan]
      description: >
        Nur in der Zeile vorhanden, in der `talk` beginnt. Für Slots, die in
        dieser Zeile von einem in einer früheren Zeile begonnenen Talk
        belegt sind, gibt es keinen Eintrag (analog zu einem
        HTML-`rowspan`).
      properties:
        slotId:
          type: string
        talk:
          $ref: '#/components/schemas/Talk'
        rowSpan:
          type: integer
          minimum: 1
          description: Anzahl 15-Minuten-Zeilen, die der Talk einnimmt.

    ScheduleRow:
      type: object
      required: [startTime, endTime, cells]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          description: Immer `startTime + 15 Minuten`.
        cells:
          type: array
          description: Nur Zellen für Slots, in denen hier ein Talk beginnt.
          items:
            $ref: '#/components/schemas/ScheduleCell'
        programItem:
          type: object
          nullable: true
          description: >
            Fester, slotübergreifender Programmpunkt (`isFixedProgram:
            true`), sofern einer in dieser Zeile beginnt.
          allOf:
            - $ref: '#/components/schemas/Talk'
            - type: object
              required: [rowSpan]
              properties:
                rowSpan:
                  type: integer
                  minimum: 1

    Schedule:
      type: object
      required: [communityDayId, slots, rows]
      properties:
        communityDayId:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        rows:
          type: array
          description: Serverseitig generiertes 15-Minuten-Zeilenraster.
          items:
            $ref: '#/components/schemas/ScheduleRow'

    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer

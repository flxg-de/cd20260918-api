openapi: 3.0.3
info:
  title: Community Day Slot Manager API
  description: |
    API zur Verwaltung von Community Days, Vortrags-Einreichungen (Talks) und
    deren Zuordnung zu Zeit-Slots.

    Ein Community Day durchläuft zwei Phasen:
      1. **Einreichungsphase** (`SUBMISSION`): Talks werden eingereicht,
         Slots existieren noch nicht oder nicht vollständig.
      2. **Planungsphase** (`PLANNING`): Organisatoren legen Slots an und
         ordnen Talks zu.

    Alle Talk- und Slot-Operationen beziehen sich implizit auf den jeweils
    aktuellen Community Day, sofern nicht explizit ein anderer (historischer)
    Community Day referenziert wird.
  version: 2.0.0
servers:
  - url: /api/v1

tags:
  - name: community-days
    description: Durchführungen des Community Day (Einreichung, Planung, Historie)
  - name: talks
    description: Vortrags-Einreichungen
  - name: slots
    description: Zeit-Slots (Tagesablauf-Blöcke und reguläre Talk-Slots)

security:
  - bearerAuth: []

paths:
  /community-days:
    get:
      tags: [community-days]
      operationId: listCommunityDays
      summary: Alle Community Days auflisten (inkl. Historie)
      security: []
      responses:
        '200':
          description: Liste der Community Days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityDay'
    post:
      tags: [community-days]
      operationId: createCommunityDay
      summary: Neuen Community Day anlegen
      description: |
        Nur für Organisatoren. Legt automatisch einen Vorschlag für den
        festen Tagesablauf (Frühstück, regionale Slots, Vorstellung,
        Mittagspause, Geschäftsführungs-Slot) als gesperrte Slots an.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDayCreateRequest'
      responses:
        '201':
          description: Community Day wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /community-days/current:
    get:
      tags: [community-days]
      operationId: getCurrentCommunityDay
      summary: Den aktuellen Community Day abrufen
      description: >
        Liefert den Community Day, für den Einreichung bzw. Planung aktuell
        offen ist.
      security: []
      responses:
        '200':
          description: Der aktuelle Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    get:
      tags: [community-days]
      operationId: getCommunityDay
      summary: Einen Community Day per ID abrufen
      security: []
      responses:
        '200':
          description: Der Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}/transition-to-planning:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    post:
      tags: [community-days]
      operationId: transitionToPlanning
      summary: Von Einreichungs- in Planungsphase wechseln
      description: |
        Nur für Organisatoren. Bewusster, nachvollziehbarer Schritt, der die
        Einreichung neuer Talks für diesen Community Day beendet und die
        Zuordnung von Talks zu Slots freischaltet. Nicht umkehrbar.
      responses:
        '200':
          description: Community Day befindet sich jetzt in der Planungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Community Day ist bereits in der Planungsphase oder abgeschlossen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks:
    get:
      tags: [talks]
      operationId: listTalks
      summary: Talks des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TalkStatus'
        - name: mine
          in: query
          required: false
          description: Nur eigene Talks des angemeldeten Referenten
          schema:
            type: boolean
      security: []
      responses:
        '200':
          description: Liste der Talks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Talk'
    post:
      tags: [talks]
      operationId: createTalk
      summary: Neuen Talk für den aktuellen Community Day einreichen
      description: Nur möglich, solange sich der aktuelle Community Day in der Einreichungsphase befindet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '201':
          description: Talk wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Aktueller Community Day befindet sich nicht in der Einreichungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    get:
      tags: [talks]
      operationId: getTalk
      summary: Einen Talk per ID abrufen
      security: []
      responses:
        '200':
          description: Der Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [talks]
      operationId: updateTalk
      summary: Talk aktualisieren
      description: >
        Nur durch den/die einreichende/n Referent/in (Besitzer/in), solange
        fachlich erlaubt (z. B. noch nicht einem Slot zugeordnet oder
        abgelehnt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk darf in seinem aktuellen Status nicht mehr geändert werden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [talks]
      operationId: withdrawTalk
      summary: Talk zurückziehen/löschen
      description: Durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/tags:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: updateTalkTags
      summary: Tags eines Talks setzen
      description: Nur durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/assignment:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: assignTalkToSlot
      summary: Talk einem Slot zuordnen (oder Zuordnung aufheben)
      description: |
        Nur für Organisatoren, nur während der Planungsphase. Beim Zuordnen
        wird geprüft, ob der Slot freie Kapazität für die Dauer des Talks hat
        und für Talk-Zuordnung freigegeben (nicht gesperrt, z. B. kein
        Frühstücks- oder Mittagspausen-Block) ist. Bei einem Konflikt wird
        die bestehende Zuordnung nicht stillschweigend überschrieben, sondern
        die Anfrage mit `409` abgelehnt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slot-Konflikt (gesperrt, bereits belegt oder Kapazität überschritten)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}/rejection:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: rejectTalk
      summary: Talk ablehnen
      description: Nur für Organisatoren. Setzt den Talk-Status auf `REJECTED`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Abgelehnter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk ist bereits einem Slot zugeordnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /slots:
    get:
      tags: [slots]
      operationId: listSlots
      summary: Alle Slots des aktuellen Community Day inkl. zugeordnetem Talk
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Location'
      security: []
      responses:
        '200':
          description: Liste der Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
    post:
      tags: [slots]
      operationId: createSlot
      summary: Neuen Slot anlegen
      description: Nur für Organisatoren, typischerweise zu Beginn der Planungsphase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '201':
          description: Slot wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/{slotId}:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    get:
      tags: [slots]
      operationId: getSlot
      summary: Einen Slot per ID abrufen
      security: []
      responses:
        '200':
          description: Der Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [slots]
      operationId: updateSlot
      summary: Slot aktualisieren (z. B. Zeiten verschieben, Swimlane ändern)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '200':
          description: Aktualisierter Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [slots]
      operationId: deleteSlot
      summary: Slot löschen
      description: >
        Nur für Organisatoren. Ein Slot mit zugeordnetem Talk kann nicht
        gelöscht werden, solange die Zuordnung besteht.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slot hat noch einen zugeordneten Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SSO/OIDC-Zugriffstoken; enthält die Rolle (`REFERENT` oder `ORGANISATOR`) des Nutzers.

  parameters:
    CommunityDayId:
      name: communityDayId
      in: path
      required: true
      schema:
        type: string
    TalkId:
      name: talkId
      in: path
      required: true
      schema:
        type: string
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Aktion für die aktuelle Rolle nicht erlaubt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CommunityDayPhase:
      type: string
      enum: [SUBMISSION, PLANNING, COMPLETED]
      description: >
        SUBMISSION: Einreichungsphase. PLANNING: Planungsphase (Slots werden
        angelegt, Talks zugeordnet). COMPLETED: Durchführung ist
        abgeschlossen und nur noch als Historie einsehbar.

    CommunityDayCreateRequest:
      type: object
      required: [name, description, date]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date

    CommunityDay:
      allOf:
        - $ref: '#/components/schemas/CommunityDayCreateRequest'
        - type: object
          required: [id, phase]
          properties:
            id:
              type: string
            phase:
              $ref: '#/components/schemas/CommunityDayPhase'

    TalkStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, REJECTED]

    Location:
      type: string
      description: Standort, relevant bei Slots vor Ort/hybrid.
      enum:
        - NOCHEN
        - ESSEN
        - BERLIN
        - HAMBURG
        - MUENCHEN
        - BAD_HOMBURG
        - NUERNBERG
        - STUTTGART
        - KRAKOW

    SlotFormat:
      type: string
      description: Format des Slots; ein zugeordneter Talk übernimmt es implizit.
      enum: [ON_SITE, HYBRID, VIRTUAL]

    TalkCreateRequest:
      type: object
      required: [title, speakers, durationMinutes]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        speakers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 80
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 120
        tags:
          type: array
          items:
            type: string

    Talk:
      allOf:
        - $ref: '#/components/schemas/TalkCreateRequest'
        - type: object
          required: [id, communityDayId, status]
          properties:
            id:
              type: string
            communityDayId:
              type: string
            status:
              $ref: '#/components/schemas/TalkStatus'
            ownerId:
              type: string
              description: ID des/der einreichenden Referent/in
            slotId:
              type: string
              nullable: true
            rejectionReason:
              type: string
              nullable: true
            teamsLink:
              type: string
              nullable: true
              description: >
                Wird nicht bei der Zuordnung selbst gesetzt, sondern erst zu
                einem späteren Zeitpunkt generiert und ergänzt.

    AssignmentRequest:
      type: object
      properties:
        slotId:
          type: string
          nullable: true
          description: null hebt eine bestehende Zuordnung auf

    SlotCreateRequest:
      type: object
      required: [room, startTime, endTime, capacityMinutes, format]
      properties:
        room:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacityMinutes:
          type: integer
          minimum: 1
        format:
          $ref: '#/components/schemas/SlotFormat'
        location:
          $ref: '#/components/schemas/Location'
        swimlane:
          type: string
          description: >
            Bündelt thematisch ähnliche Talks über den Tag hinweg (z. B. KI,
            Management, Tech). Bis zu ca. 5 parallele Swimlanes je Zeitfenster.
        locked:
          type: boolean
          default: false
          description: >
            true für feste Tagesablauf-Blöcke (Frühstück, regionale Slots,
            Vorstellung, Mittagspause, Geschäftsführungs-Slot); solche Slots
            sind für freie Talk-Zuordnung gesperrt.
        label:
          type: string
          description: Bezeichnung des Blocks, z. B. "Mittagspause" bei gesperrten Slots.

    Slot:
      allOf:
        - $ref: '#/components/schemas/SlotCreateRequest'
        - type: object
          required: [id, communityDayId]
          properties:
            id:
              type: string
            communityDayId:
              type: string
            talk:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Talk'

    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer

openapi: 3.0.3
info:
  title: Community Day Slot Manager API
  description: |
    API zur Verwaltung von Community Days, Vortrags-Einreichungen (Talks) und
    deren Zuordnung zu Zeit-Slots.

    ## Tagesraster: Slots × Zeitfenster

    Der Tagesablauf wird als Tabelle gedacht (siehe interne Confluence-Seite):
    Spalten sind **Slots** — benannte, über den ganzen Tag laufende Tracks/
    Swimlanes (z. B. "Amt für gute Ideen", "Neuland"), inkl. Raum, Standort
    und Format. Zeilen sind **Zeitfenster** (`TimeBlock`) mit Start-/Endzeit,
    z. B. 10:00–11:00. Ein Talk wird konkret der **Zelle** aus Slot ×
    Zeitfenster zugeordnet (Assignment).

    Manche Zeitfenster gehören zum festen Tagesablauf (Frühstück, regionale
    Slots, Vorstellung, Mittagspause, Geschäftsführungs-Slot) und gelten
    slot-/track-übergreifend für den ganzen Tag; sie sind für freie
    Talk-Zuordnung gesperrt (`locked: true`) und benötigen keinen Slot.

    Ein Community Day durchläuft zwei Phasen:
      1. **Einreichungsphase** (`SUBMISSION`): Talks werden eingereicht,
         Slots/Zeitfenster existieren noch nicht oder nicht vollständig.
      2. **Planungsphase** (`PLANNING`): Organisatoren legen Slots und
         Zeitfenster an und ordnen Talks den Zellen zu.

    Alle Talk-, Slot- und Zeitfenster-Operationen beziehen sich implizit auf
    den jeweils aktuellen Community Day, sofern nicht explizit ein anderer
    (historischer) Community Day referenziert wird.
  version: 3.0.0
servers:
  - url: /api/v1

tags:
  - name: community-days
    description: Durchführungen des Community Day (Einreichung, Planung, Historie)
  - name: talks
    description: Vortrags-Einreichungen
  - name: slots
    description: Benannte Tracks/Swimlanes (Spalten des Tagesrasters)
  - name: time-blocks
    description: Zeitfenster des Tages (Zeilen des Tagesrasters), inkl. fester Tagesablauf-Blöcke
  - name: schedule
    description: Kombinierte Tagesübersicht (Slots × Zeitfenster × zugeordnete Talks)

security:
  - bearerAuth: []

paths:
  /community-days:
    get:
      tags: [community-days]
      operationId: listCommunityDays
      summary: Alle Community Days auflisten (inkl. Historie)
      security: []
      responses:
        '200':
          description: Liste der Community Days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityDay'
    post:
      tags: [community-days]
      operationId: createCommunityDay
      summary: Neuen Community Day anlegen
      description: |
        Nur für Organisatoren. Legt automatisch einen Vorschlag für den
        festen Tagesablauf (Frühstück, regionale Slots, Vorstellung,
        Mittagspause, Geschäftsführungs-Slot) als gesperrte Zeitfenster an.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDayCreateRequest'
      responses:
        '201':
          description: Community Day wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /community-days/current:
    get:
      tags: [community-days]
      operationId: getCurrentCommunityDay
      summary: Den aktuellen Community Day abrufen
      description: >
        Liefert den Community Day, für den Einreichung bzw. Planung aktuell
        offen ist.
      security: []
      responses:
        '200':
          description: Der aktuelle Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    get:
      tags: [community-days]
      operationId: getCommunityDay
      summary: Einen Community Day per ID abrufen
      security: []
      responses:
        '200':
          description: Der Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [community-days]
      operationId: updateCommunityDay
      summary: Stammdaten des Community Day bearbeiten (Titel, Datum, Fristen)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDayUpdateRequest'
      responses:
        '200':
          description: Aktualisierter Community Day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /community-days/{communityDayId}/transition-to-planning:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    post:
      tags: [community-days]
      operationId: transitionToPlanning
      summary: Von Einreichungs- in Planungsphase wechseln
      description: |
        Nur für Organisatoren. Bewusster, nachvollziehbarer Schritt, der die
        Einreichung neuer Talks für diesen Community Day beendet und die
        Zuordnung von Talks zu Slot/Zeitfenster-Zellen freischaltet. Nicht
        umkehrbar.
      responses:
        '200':
          description: Community Day befindet sich jetzt in der Planungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Community Day ist bereits in der Planungsphase oder abgeschlossen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /community-days/{communityDayId}/transition-to-published:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    post:
      tags: [community-days]
      operationId: transitionToPublished
      summary: Programm veröffentlichen (Planungs- in Veröffentlichungsphase wechseln)
      description: |
        Nur für Organisatoren. Beendet die Planung und macht das Programm für
        alle sichtbar (Programm-Ansicht, Favoriten/"Mein Tag"). Nicht umkehrbar.
      responses:
        '200':
          description: Community Day befindet sich jetzt in der Veröffentlichungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Community Day ist nicht in der Planungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /community-days/{communityDayId}/schedule:
    parameters:
      - $ref: '#/components/parameters/CommunityDayId'
    get:
      tags: [schedule]
      operationId: getSchedule
      summary: Kombinierte Tagesübersicht (Slots × Zeitfenster × Talks)
      description: >
        Entspricht der tabellarischen Tagesübersicht: alle Slots (Spalten),
        alle Zeitfenster (Zeilen) und je Zelle der dort zugeordnete Talk,
        sofern vorhanden. Grundlage für Planungsansicht und Kalender-UI.
      security: []
      responses:
        '200':
          description: Tagesübersicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks:
    get:
      tags: [talks]
      operationId: listTalks
      summary: Talks des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TalkStatus'
        - name: mine
          in: query
          required: false
          description: Nur eigene Talks des angemeldeten Referenten
          schema:
            type: boolean
        - name: favorite
          in: query
          required: false
          description: Nur vom angemeldeten Nutzer favorisierte Talks ("Mein Tag")
          schema:
            type: boolean
      security: []
      responses:
        '200':
          description: Liste der Talks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Talk'
    post:
      tags: [talks]
      operationId: createTalk
      summary: Neuen Talk für den aktuellen Community Day einreichen
      description: Nur möglich, solange sich der aktuelle Community Day in der Einreichungsphase befindet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '201':
          description: Talk wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Aktueller Community Day befindet sich nicht in der Einreichungsphase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    get:
      tags: [talks]
      operationId: getTalk
      summary: Einen Talk per ID abrufen
      security: []
      responses:
        '200':
          description: Der Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [talks]
      operationId: updateTalk
      summary: Talk aktualisieren
      description: >
        Nur durch den/die einreichende/n Referent/in (Besitzer/in), solange
        fachlich erlaubt (z. B. noch nicht zugeordnet oder abgelehnt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalkCreateRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk darf in seinem aktuellen Status nicht mehr geändert werden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [talks]
      operationId: withdrawTalk
      summary: Talk zurückziehen/löschen
      description: Durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/tags:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: updateTalkTags
      summary: Tags eines Talks setzen
      description: Nur durch den/die Referent/in (Besitzer/in) oder Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/assignment:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: assignTalkToSlot
      summary: Talk einer Slot/Zeitfenster-Zelle zuordnen (oder Zuordnung aufheben)
      description: |
        Nur für Organisatoren, nur während der Planungsphase. Beim Zuordnen
        wird geprüft, ob das Zeitfenster für Talk-Zuordnung freigegeben ist
        (nicht `locked`, z. B. kein Frühstücks- oder Mittagspausen-Block),
        ob die Zelle (Slot + Zeitfenster) noch frei ist, und ob das
        Zeitfenster ausreichend Kapazität für die Dauer des Talks hat. Bei
        einem Konflikt wird die bestehende Zuordnung nicht stillschweigend
        überschrieben, sondern die Anfrage mit `409` abgelehnt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Konflikt (Zeitfenster gesperrt, Zelle bereits belegt oder Kapazität überschritten)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /talks/{talkId}/vote:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    post:
      tags: [talks]
      operationId: voteForTalk
      summary: Interessestimme für einen Talk abgeben
      description: Ein Nutzer kann pro Talk höchstens einmal abstimmen.
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nutzer hat bereits für diesen Talk abgestimmt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [talks]
      operationId: removeVoteForTalk
      summary: Eigene Interessestimme für einen Talk zurückziehen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/favorite:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    post:
      tags: [talks]
      operationId: favoriteTalk
      summary: Talk zu "Mein Tag" hinzufügen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [talks]
      operationId: unfavoriteTalk
      summary: Talk aus "Mein Tag" entfernen
      responses:
        '200':
          description: Aktualisierter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          $ref: '#/components/responses/NotFound'

  /talks/{talkId}/rejection:
    parameters:
      - $ref: '#/components/parameters/TalkId'
    put:
      tags: [talks]
      operationId: rejectTalk
      summary: Talk ablehnen
      description: Nur für Organisatoren. Setzt den Talk-Status auf `REJECTED`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Abgelehnter Talk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Talk ist bereits einer Zelle zugeordnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /slots:
    get:
      tags: [slots]
      operationId: listSlots
      summary: Alle Slots (Tracks/Spalten) des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Location'
      security: []
      responses:
        '200':
          description: Liste der Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
    post:
      tags: [slots]
      operationId: createSlot
      summary: Neuen Slot (Track/Spalte) anlegen
      description: >
        Nur für Organisatoren, typischerweise zu Beginn der Planungsphase.
        Die Anzahl der Slots ergibt sich aus dem Bedarf der eingereichten
        Talks (erfahrungsgemäß bis zu 5 parallele Slots).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '201':
          description: Slot wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /slots/{slotId}:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    get:
      tags: [slots]
      operationId: getSlot
      summary: Einen Slot per ID abrufen
      security: []
      responses:
        '200':
          description: Der Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [slots]
      operationId: updateSlot
      summary: Slot aktualisieren (z. B. Name, Raum, Standort, Format)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreateRequest'
      responses:
        '200':
          description: Aktualisierter Slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [slots]
      operationId: deleteSlot
      summary: Slot löschen
      description: >
        Nur für Organisatoren. Ein Slot mit noch bestehenden Talk-Zuordnungen
        in irgendeinem Zeitfenster kann nicht gelöscht werden.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slot hat noch zugeordnete Talks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /time-blocks:
    get:
      tags: [time-blocks]
      operationId: listTimeBlocks
      summary: Alle Zeitfenster des aktuellen Community Day auflisten
      parameters:
        - name: communityDayId
          in: query
          required: false
          description: Optional ein historischer Community Day statt des aktuellen
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Liste der Zeitfenster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeBlock'
    post:
      tags: [time-blocks]
      operationId: createTimeBlock
      summary: Neues Zeitfenster anlegen
      description: >
        Nur für Organisatoren. Für einen neuen Community Day wird das feste
        Tagesablauf-Grundgerüst (Frühstück, regionale Slots, Vorstellung,
        Mittagspause, Geschäftsführungs-Slot) bereits automatisch als
        gesperrte Zeitfenster vorgeschlagen; hierüber lassen sich weitere
        (reguläre oder zusätzliche gesperrte) Zeitfenster ergänzen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeBlockCreateRequest'
      responses:
        '201':
          description: Zeitfenster wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /time-blocks/{timeBlockId}:
    parameters:
      - $ref: '#/components/parameters/TimeBlockId'
    get:
      tags: [time-blocks]
      operationId: getTimeBlock
      summary: Ein Zeitfenster per ID abrufen
      security: []
      responses:
        '200':
          description: Das Zeitfenster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBlock'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [time-blocks]
      operationId: updateTimeBlock
      summary: Zeitfenster aktualisieren (z. B. Zeiten verschieben)
      description: Nur für Organisatoren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeBlockCreateRequest'
      responses:
        '200':
          description: Aktualisiertes Zeitfenster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [time-blocks]
      operationId: deleteTimeBlock
      summary: Zeitfenster löschen
      description: >
        Nur für Organisatoren. Ein Zeitfenster mit noch bestehenden
        Talk-Zuordnungen kann nicht gelöscht werden.
      responses:
        '204':
          description: Gelöscht
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Zeitfenster hat noch zugeordnete Talks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SSO/OIDC-Zugriffstoken; enthält die Rolle (`REFERENT` oder `ORGANISATOR`) des Nutzers.

  parameters:
    CommunityDayId:
      name: communityDayId
      in: path
      required: true
      schema:
        type: string
    TalkId:
      name: talkId
      in: path
      required: true
      schema:
        type: string
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string
    TimeBlockId:
      name: timeBlockId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Aktion für die aktuelle Rolle nicht erlaubt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CommunityDayPhase:
      type: string
      enum: [SUBMISSION, PLANNING, PUBLISHED, COMPLETED]
      description: >
        SUBMISSION: Einreichungsphase. PLANNING: Planungsphase (Slots und
        Zeitfenster werden angelegt, Talks zugeordnet). PUBLISHED: Programm
        ist veröffentlicht (Programm-Ansicht und Favoriten/"Mein Tag" sind
        sichtbar). COMPLETED: Durchführung ist abgeschlossen und nur noch
        als Historie einsehbar.

    CommunityDayCreateRequest:
      type: object
      required: [name, description, date]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date
        submissionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Einsendeschluss für reguläre Einreichungen.
        lateSubmissionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Letzter Termin für Nachreichungen während der Planungsphase.

    CommunityDayUpdateRequest:
      type: object
      description: Teilaktualisierung der Stammdaten; nicht gesetzte Felder bleiben unverändert.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date
        submissionDeadline:
          type: string
          format: date-time
          nullable: true
        lateSubmissionDeadline:
          type: string
          format: date-time
          nullable: true

    CommunityDay:
      allOf:
        - $ref: '#/components/schemas/CommunityDayCreateRequest'
        - type: object
          required: [id, phase]
          properties:
            id:
              type: string
            phase:
              $ref: '#/components/schemas/CommunityDayPhase'

    TalkStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, REJECTED]

    Location:
      type: string
      description: Standort, relevant bei Slots vor Ort/hybrid.
      enum:
        - NOCHEN
        - ESSEN
        - BERLIN
        - HAMBURG
        - MUENCHEN
        - BAD_HOMBURG
        - NUERNBERG
        - STUTTGART
        - KRAKOW

    SlotFormat:
      type: string
      description: Format des Slots; ein zugeordneter Talk übernimmt es implizit.
      enum: [ON_SITE, HYBRID, VIRTUAL]

    TalkCreateRequest:
      type: object
      required: [title, speakers, durationMinutes]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        speakers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 80
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 120
        tags:
          type: array
          items:
            type: string

    Talk:
      allOf:
        - $ref: '#/components/schemas/TalkCreateRequest'
        - type: object
          required: [id, communityDayId, status]
          properties:
            id:
              type: string
            communityDayId:
              type: string
            status:
              $ref: '#/components/schemas/TalkStatus'
            ownerId:
              type: string
              description: ID des/der einreichenden Referent/in
            slotId:
              type: string
              nullable: true
              description: Track/Spalte, der der Talk zugeordnet ist
            timeBlockId:
              type: string
              nullable: true
              description: Zeitfenster/Zeile, dem der Talk zugeordnet ist
            rejectionReason:
              type: string
              nullable: true
            votes:
              type: integer
              default: 0
              description: Anzahl der Interessestimmen.
            votedByMe:
              type: boolean
              default: false
              description: Ob der angemeldete Nutzer bereits für diesen Talk abgestimmt hat.
            favoritedByMe:
              type: boolean
              default: false
              description: Ob der angemeldete Nutzer diesen Talk zu "Mein Tag" hinzugefügt hat.
            teamsLink:
              type: string
              nullable: true
              description: >
                Wird nicht bei der Zuordnung selbst gesetzt, sondern erst zu
                einem späteren Zeitpunkt generiert und ergänzt.

    AssignmentRequest:
      type: object
      description: >
        Zum Zuordnen müssen `slotId` und `timeBlockId` gemeinsam gesetzt
        werden; beide `null` hebt eine bestehende Zuordnung auf.
      properties:
        slotId:
          type: string
          nullable: true
        timeBlockId:
          type: string
          nullable: true

    SlotCreateRequest:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
          description: >
            Name des Tracks/der Swimlane (Spaltenüberschrift), z. B. "Amt für
            gute Ideen" oder "Neuland". Bündelt über den Tag hinweg
            thematisch ähnliche Talks.
        room:
          type: string
        format:
          $ref: '#/components/schemas/SlotFormat'
        location:
          $ref: '#/components/schemas/Location'

    Slot:
      allOf:
        - $ref: '#/components/schemas/SlotCreateRequest'
        - type: object
          required: [id, communityDayId]
          properties:
            id:
              type: string
            communityDayId:
              type: string

    TimeBlockCreateRequest:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        label:
          type: string
          description: Bezeichnung, z. B. "Mittagspause" bei gesperrten Zeitfenstern.
        locked:
          type: boolean
          default: false
          description: >
            true für feste Tagesablauf-Blöcke (Frühstück, regionale Slots,
            Vorstellung, Mittagspause, Geschäftsführungs-Slot). Diese gelten
            slotübergreifend für den ganzen Tag und sind für freie
            Talk-Zuordnung gesperrt.

    TimeBlock:
      allOf:
        - $ref: '#/components/schemas/TimeBlockCreateRequest'
        - type: object
          required: [id, communityDayId]
          properties:
            id:
              type: string
            communityDayId:
              type: string

    ScheduleCell:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
        talk:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Talk'

    ScheduleRow:
      allOf:
        - $ref: '#/components/schemas/TimeBlock'
        - type: object
          properties:
            cells:
              type: array
              description: Leer/nicht gesetzt bei gesperrten, slotübergreifenden Zeitfenstern.
              items:
                $ref: '#/components/schemas/ScheduleCell'

    Schedule:
      type: object
      required: [communityDayId, slots, timeBlocks]
      properties:
        communityDayId:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        timeBlocks:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRow'

    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
